name: Export deterministic build JDK

on:
  push:
    branches: [dms-buildenv-export]

permissions:
  contents: read

jobs:
  export-jdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - name: Record and package JDK
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -version 2>&1 | tee /tmp/java-version.txt
          tar -C "$JAVA_HOME" -czf /tmp/dms-temurin17-linux-x64.tar.gz .
          sha256sum /tmp/dms-temurin17-linux-x64.tar.gz | tee /tmp/dms-temurin17-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dms-temurin17-linux-x64
          path: |
            /tmp/dms-temurin17-linux-x64.tar.gz
            /tmp/dms-temurin17-linux-x64.sha256
            /tmp/java-version.txt
          retention-days: 90
