name: Export Gradle cache supplement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=cache-supplement \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve project dependencies
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - name: Pack classpath supplement
        run: |
          cd "$HOME"
          tar -czf /tmp/gradle-cache-supplement.tar.gz \
            .gradle/caches/modules-2/metadata-2.106 \
            .gradle/caches/modules-2/files-2.1/com.android.tools.build.jetifier \
            .gradle/caches/modules-2/files-2.1/org.ow2.asm \
            .gradle/caches/modules-2/files-2.1/jakarta.xml.bind \
            .gradle/caches/modules-2/files-2.1/jakarta.activation \
            .gradle/caches/modules-2/files-2.1/com.google.code.findbugs \
            .gradle/caches/modules-2/files-2.1/com.google.j2objc \
            .gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin \
            .gradle/caches/modules-2/files-2.1/androidx.lifecycle \
            .gradle/caches/modules-2/files-2.1/androidx.concurrent
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-cache-supplement
          path: /tmp/gradle-cache-supplement.tar.gz
      - name: Mark delivery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${CI_STATE}" \
            -f context=cache-supplement \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
