name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "Data Matrix Scanner — latest debug" \
            --notes "Автоматическая debug-сборка из main. Скачайте app-debug.apk в Assets."
