name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish CI run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=ci-delivery \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Materialize canonical 0.6.4 source
        run: |
          set -euo pipefail
          cat ci/payload/part* > /tmp/dms-patch.b64
          echo "a503e650ed43b761d56c051e6e159c535744125c69f80513cef79ad3bd77d19c  /tmp/dms-patch.b64" | sha256sum -c -
          base64 -d /tmp/dms-patch.b64 | gzip -dc > /tmp/dms-0.6.4.patch
          python -m pip install --quiet gdown
          gdown --fuzzy "https://drive.google.com/file/d/1LNTzHeyMT0Ph1aO-vxZWj-7ao7zED5FD/view" -O /tmp/dms-base.zip
          rm -rf /tmp/dms-base
          mkdir -p /tmp/dms-base
          unzip -q /tmp/dms-base.zip -d /tmp/dms-base
          SRC=/tmp/dms-base
          if [ ! -f "$SRC/settings.gradle.kts" ]; then
            SRC="$(find /tmp/dms-base -mindepth 1 -maxdepth 2 -type f -name settings.gradle.kts -printf '%h\n' | head -n1)"
          fi
          test -n "$SRC"
          test -f "$SRC/settings.gradle.kts"
          (cd "$SRC" && patch -p1 --batch --forward < /tmp/dms-0.6.4.patch)
          rsync -a --delete --exclude='.git/' --exclude='ci/' "$SRC/" ./
          grep -q 'versionCode = 35' app/build.gradle.kts
          grep -q 'versionName = "0.6.4"' app/build.gradle.kts
      - name: Prepare source snapshot
        run: |
          rm -rf /tmp/datamatrix-scanner-source
          mkdir -p /tmp/datamatrix-scanner-source
          rsync -a --exclude='.git/' --exclude='.gradle/' --exclude='.kotlin/' --exclude='build/' --exclude='ci/' ./ /tmp/datamatrix-scanner-source/
      - name: Prepare local signing tools fallback
        run: |
          mkdir -p /tmp/android-build-tools/lib
          mkdir -p /tmp/android-build-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/android-build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/android-build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" /tmp/android-build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/android-build-tools/lib/
          LIBCXX="$(find "$ANDROID_HOME/build-tools/35.0.0" -type f -name 'libc++.so' -print -quit)"
          test -n "$LIBCXX"
          cp "$LIBCXX" /tmp/android-build-tools/lib64/libc++.so
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-scanner-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-scanner-source
          path: /tmp/datamatrix-scanner-source/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-local-fallback
          path: /tmp/android-build-tools/
      - name: Publish latest debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "Data Matrix Scanner — latest debug" \
            --notes "Автоматическая debug-сборка из резервного GitHub CI. Основная актуальная кодовая копия хранится на Google Drive."
      - name: Mark CI delivery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${CI_STATE}" \
            -f context=ci-delivery \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
