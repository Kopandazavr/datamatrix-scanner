name: Bootstrap offline Android toolchain

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish bootstrap run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=offline-bootstrap \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prime Gradle and dependency caches on unchanged baseline
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Pack offline toolchain
        run: |
          rm -f /tmp/datamatrix-offline-gradle.tar.gz /tmp/datamatrix-offline-android.tar.gz
          tar --exclude='*.lock' --exclude='daemon' -czf /tmp/datamatrix-offline-gradle.tar.gz -C "$HOME" .gradle
          tar -czf /tmp/datamatrix-offline-android.tar.gz \
            -C "$ANDROID_HOME" platforms/android-35 build-tools/35.0.0 platform-tools licenses
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-offline-gradle
          path: /tmp/datamatrix-offline-gradle.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-offline-android-sdk
          path: /tmp/datamatrix-offline-android.tar.gz
          compression-level: 0
      - name: Restore regular CI workflow
        run: |
          git show 87353953e9401545c9291963225402f27d32a808:.github/workflows/android.yml > .github/workflows/android.yml
          git add .github/workflows/android.yml
          git config user.name "Kopandazavr"
          git config user.email "101416382+Kopandazavr@users.noreply.github.com"
          git commit -m "ci: restore Android build workflow"
          git push origin HEAD:main
      - name: Mark bootstrap status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${CI_STATE}" \
            -f context=offline-bootstrap \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
