name: Bootstrap offline Android toolchain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prime Gradle and dependency caches on unchanged baseline
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Pack offline Gradle cache
        run: |
          rm -rf /tmp/offline-gradle
          mkdir -p /tmp/offline-gradle
          rsync -a --exclude='*.lock' --exclude='daemon/' "$HOME/.gradle/" /tmp/offline-gradle/
      - name: Pack minimal Android SDK 35
        run: |
          rm -rf /tmp/offline-android
          mkdir -p /tmp/offline-android/platforms /tmp/offline-android/build-tools
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/offline-android/platforms/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/offline-android/build-tools/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/offline-android/
          if [ -d "$ANDROID_HOME/licenses" ]; then cp -a "$ANDROID_HOME/licenses" /tmp/offline-android/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-offline-gradle
          path: /tmp/offline-gradle/
          include-hidden-files: true
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-offline-android-sdk
          path: /tmp/offline-android/
          include-hidden-files: true
          compression-level: 6
      - name: Restore regular CI workflow
        run: |
          git show HEAD^:.github/workflows/android.yml > .github/workflows/android.yml
          git add .github/workflows/android.yml
          git config user.name "Kopandazavr"
          git config user.email "101416382+Kopandazavr@users.noreply.github.com"
          git commit -m "ci: restore Android build workflow"
          git push origin HEAD:main
