name: Export Android build tools 34

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=sdk34-export \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install and pack build-tools 34
        run: |
          sdkmanager "build-tools;34.0.0"
          tar -czf /tmp/android-build-tools-34.tar.gz -C "$ANDROID_HOME" build-tools/34.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-34
          path: /tmp/android-build-tools-34.tar.gz
          compression-level: 0
      - name: Mark status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${CI_STATE}" \
            -f context=sdk34-export \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
