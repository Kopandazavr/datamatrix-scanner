name: Export split Gradle cache

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  export-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=offline-cache-export \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prime exact project cache
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Pack cache into downloadable pieces
        run: |
          set -euxo pipefail
          rm -rf /tmp/cache-parts && mkdir -p /tmp/cache-parts
          tar --exclude='*.lock' --exclude='daemon' -czf /tmp/cache-parts/wrapper.tar.gz -C "$HOME" .gradle/wrapper
          tar --exclude='*.lock' -czf /tmp/cache-parts/modules.tar.gz -C "$HOME" .gradle/caches/modules-2
          TRANSFORM_PATHS=()
          [ -d "$HOME/.gradle/caches/transforms-4" ] && TRANSFORM_PATHS+=(.gradle/caches/transforms-4)
          [ -d "$HOME/.gradle/caches/8.9/transforms" ] && TRANSFORM_PATHS+=(.gradle/caches/8.9/transforms)
          if [ ${#TRANSFORM_PATHS[@]} -gt 0 ]; then
            tar --exclude='*.lock' -czf /tmp/cache-parts/transforms.tar.gz -C "$HOME" "${TRANSFORM_PATHS[@]}"
          else
            tar -czf /tmp/cache-parts/transforms.tar.gz --files-from /dev/null
          fi
          tar --exclude='*.lock' --exclude='.gradle/daemon' --exclude='.gradle/wrapper' \
              --exclude='.gradle/caches/modules-2' --exclude='.gradle/caches/transforms-4' \
              --exclude='.gradle/caches/8.9/transforms' \
              -czf /tmp/cache-parts/misc.tar.gz -C "$HOME" .gradle
          ls -lh /tmp/cache-parts
          for f in /tmp/cache-parts/*.tar.gz; do
            test "$(stat -c %s "$f")" -lt 520000000
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-part
          path: /tmp/cache-parts/wrapper.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-modules-part
          path: /tmp/cache-parts/modules.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-transforms-part
          path: /tmp/cache-parts/transforms.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-misc-part
          path: /tmp/cache-parts/misc.tar.gz
          compression-level: 0
      - name: Mark status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${CI_STATE}" \
            -f context=offline-cache-export \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
