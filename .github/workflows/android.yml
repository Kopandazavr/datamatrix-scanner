name: CI 0.6.6 launcher icons

on:
  push:
    branches: [ci-icons-066-20260826]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply 0.6.6 WIP patch
        run: |
          gzip -dc ci/0.6.6-icons.patch.gz | git apply
          grep -q 'versionCode = 37' app/build.gradle.kts
          grep -q 'versionName = "0.6.6"' app/build.gradle.kts
      - name: Create compile-only launcher placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          JPEG=''
          PNG='iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAGUlEQVR4nGNUcEhgIAUwkaR6VMOohiGlAQB+bgDgFmtm7QAAAABJRU5ErkJggg=='
          for n in 01 02 03 04 05 06 07; do
            printf '%s' "$JPEG" | base64 -d > "app/src/main/res/drawable-nodpi/launcher_master_${n}.jpg"
          done
          printf '%s' "$PNG" | base64 -d > app/src/main/res/drawable-nodpi/launcher_master_08.png
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest assembleDebug assembleRelease -x lintVitalRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-scanner-0.6.6-release-unsigned-ci
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: datamatrix-scanner-0.6.6-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datamatrix-scanner-0.6.6-test-results
          path: app/build/test-results/testDebugUnitTest/
