name: Export Android build tools 35.0.0

on:
  push:
    branches: [v046-tool-export-20260824]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Prepare tools bundle
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          test -x "$BT/aapt2"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          tar -C "${ANDROID_HOME}/build-tools" -czf /tmp/android-build-tools-35.0.0.tar.gz 35.0.0
          sha256sum /tmp/android-build-tools-35.0.0.tar.gz

      - name: Upload public build tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35.0.0
          path: /tmp/android-build-tools-35.0.0.tar.gz

      - name: Record run id
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/v046-tools-run-id.txt
          git config user.name Kopandazavr
          git config user.email 101416382+Kopandazavr@users.noreply.github.com
          git add .github/v046-tools-run-id.txt
          git commit -m "chore: record build tools run id"
          git push origin HEAD:v046-tool-export-20260824
