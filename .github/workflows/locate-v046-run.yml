name: Locate 0.4.6 build run

on:
  push:
    branches: [v046-run-locator-20260824]

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate completed publisher and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TRIGGER_SHA: 7a25844c27c4eace3e49d4c32b79489c83f56271
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f head_sha="$TARGET_TRIGGER_SHA" -f per_page=20 > /tmp/runs.json
          python3 - <<'PY'
          import json, os, subprocess
          runs = json.load(open('/tmp/runs.json'))['workflow_runs']
          matches = [r for r in runs if r.get('name') == 'Publish 0.4.6 safely']
          if not matches:
              raise SystemExit('publisher run not found')
          r = matches[0]
          run_id = r['id']
          artifacts_raw = subprocess.check_output([
              'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts"
          ], text=True)
          artifacts = json.loads(artifacts_raw).get('artifacts', [])
          wanted = [a for a in artifacts if a.get('name') == 'datamatrix-scanner-0.4.6-debug']
          info = {
              'run_id': run_id,
              'status': r.get('status'),
              'conclusion': r.get('conclusion'),
              'html_url': r.get('html_url'),
              'head_sha': r.get('head_sha'),
              'artifact': wanted[0] if wanted else None,
          }
          os.makedirs('.github', exist_ok=True)
          json.dump(info, open('.github/v046-run-info.json', 'w'), indent=2)
          print(json.dumps(info, indent=2))
          if r.get('conclusion') != 'success':
              raise SystemExit(f"publisher conclusion: {r.get('conclusion')}")
          if not wanted:
              raise SystemExit('APK artifact not found')
          PY

      - name: Save metadata on locator branch
        run: |
          set -euo pipefail
          git config user.name Kopandazavr
          git config user.email 101416382+Kopandazavr@users.noreply.github.com
          git add .github/v046-run-info.json
          git commit -m "chore: record 0.4.6 build metadata"
          git push origin HEAD:v046-run-locator-20260824
